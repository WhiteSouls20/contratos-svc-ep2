# EP3 / IE1 — Prometheus recolecta las metricas de la app (no solo del contenedor)
# desde /actuator/prometheus en cada replica, cada 15 s.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contratos-svc
  namespace: contratos
  labels:
    app: contratos-svc
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: contratos-svc
  namespaceSelector:
    matchNames: [contratos]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
