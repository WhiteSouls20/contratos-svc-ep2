apiVersion: v1
kind: Service
metadata:
  name: contratos-svc
  namespace: contratos
  labels:
    app: contratos-svc   # lo usa el ServiceMonitor de Prometheus (monitoring/servicemonitor.yaml)
spec:
  type: ClusterIP
  selector:
    app: contratos-svc
  ports:
    - name: http
      port: 80
      targetPort: http
