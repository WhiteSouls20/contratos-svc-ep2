# Escalado horizontal: entre 2 y 5 replicas segun uso de CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contratos-svc
  namespace: contratos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contratos-svc
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
# Siempre queda al menos 1 replica disponible durante mantenciones del cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: contratos-svc
  namespace: contratos
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: contratos-svc
