apiVersion: apps/v1
kind: Deployment
metadata:
  name: contratos-svc
  namespace: contratos
  labels:
    app: contratos-svc
spec:
  replicas: 2
  revisionHistoryLimit: 5          # permite "kubectl rollout undo" a versiones anteriores
  selector:
    matchLabels:
      app: contratos-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0            # nunca baja la capacidad durante un despliegue
  template:
    metadata:
      labels:
        app: contratos-svc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contratos-svc
          # El pipeline reemplaza esta imagen por ghcr.io/<owner>/contratos-svc:sha-<commit>
          image: contratos-svc:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: contratos-svc-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24     # hasta 2 minutos para arrancar
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
