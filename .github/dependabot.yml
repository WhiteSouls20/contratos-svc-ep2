version: 2
updates:
  # Dependencias Java (pom.xml)
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencias, seguridad]
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      testing:
        patterns: ["io.cucumber*", "org.junit*"]

  # Imagenes base del Dockerfile
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, docker]
    commit-message:
      prefix: "chore(docker)"

  # Versiones de las actions del pipeline
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, ci]
    commit-message:
      prefix: "chore(ci)"
